<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEUANGANKU - Pencatatan Pribadi</title>
    
    <!-- CSS Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- JS Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @media print {
            #sidebar, header, .no-print { display: none !important; }
            main { padding: 0 !important; overflow: visible !important; }
            .print-full { width: 100% !important; }
            body { background: white !important; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- CONSTANTS & DEFAULTS ---
        const DEFAULT_CATEGORIES = {
            income: ["Gaji", "Tunjangan", "Usaha", "Bonus", "Hadiah", "Pemasukan lainnya"],
            expense: ["Makan pagi", "Makan siang", "Makan malam", "Bensin", "Air minum galon", "Belanja kebutuhan", "Transportasi", "Tagihan", "Kesehatan", "Pendidikan", "Hiburan", "Lain-lain"]
        };

        const DEFAULT_BUDGETS = {
            daily: {
                "Makan pagi": 15000,
                "Makan siang": 10000,
                "Makan malam": 25000,
                "Total makan": 50000
            },
            monthly: {
                "Bensin": 500000,
                "Air minum galon": 200000
            }
        };

        // --- UTILITIES ---
        const formatRupiah = (angka) => {
            if (angka === undefined || angka === null) return 'Rp0';
            const isNegative = angka < 0;
            const absolute = Math.abs(angka);
            const formatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(absolute);
            return isNegative ? `-Rp${formatted.replace('Rp', '').trim()}` : `Rp${formatted.replace('Rp', '').trim()}`;
        };

        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substring(2);

        // Calculate warnings based on transactions and a specific date
        const checkWarnings = (txs, dateToCheck, budgetsConfig) => {
            const warnings = [];
            const month = dateToCheck.substring(0, 7);
            
            const dailyTxs = txs.filter(t => t.date === dateToCheck && t.type === 'expense');
            const monthlyTxs = txs.filter(t => t.date.startsWith(month) && t.type === 'expense');

            const dailySums = {};
            dailyTxs.forEach(t => dailySums[t.category] = (dailySums[t.category] || 0) + t.amount);
            
            const monthlySums = {};
            monthlyTxs.forEach(t => monthlySums[t.category] = (monthlySums[t.category] || 0) + t.amount);

            const totalMakan = (dailySums['Makan pagi']||0) + (dailySums['Makan siang']||0) + (dailySums['Makan malam']||0);
            
            // Check Daily
            Object.keys(budgetsConfig.daily).forEach(cat => {
                const limit = budgetsConfig.daily[cat];
                const spent = cat === 'Total makan' ? totalMakan : (dailySums[cat] || 0);
                if (limit > 0 && spent > 0) {
                    const pct = spent / limit;
                    if (pct > 1) {
                        warnings.push({ type: 'danger', cat, msg: `🚨 Anggaran ${cat} terlampaui ${formatRupiah(spent - limit)}. Batas harian ${formatRupiah(limit)}, pengeluaran hari ini ${formatRupiah(spent)}.` });
                    } else if (pct === 1) {
                        warnings.push({ type: 'danger', cat, msg: `🛑 Batas anggaran ${cat} harian tercapai tepat ${formatRupiah(limit)}.` });
                    } else if (pct >= 0.8) {
                        warnings.push({ type: 'warning', cat, msg: `⚠️ Pengeluaran ${cat} harian mencapai ${Math.round(pct*100)}%. Sisa ${formatRupiah(limit - spent)}.` });
                    }
                }
            });

            // Check Monthly
            Object.keys(budgetsConfig.monthly).forEach(cat => {
                const limit = budgetsConfig.monthly[cat];
                const spent = monthlySums[cat] || 0;
                if (limit > 0 && spent > 0) {
                    const pct = spent / limit;
                    if (pct > 1) {
                        warnings.push({ type: 'danger', cat, msg: `🚨 Pengeluaran ${cat} sudah mencapai ${formatRupiah(spent)} dari ${formatRupiah(limit)}. Terlampaui ${formatRupiah(spent - limit)}.` });
                    } else if (pct === 1) {
                        warnings.push({ type: 'danger', cat, msg: `🛑 Batas anggaran ${cat} bulanan tercapai tepat ${formatRupiah(limit)}.` });
                    } else if (pct >= 0.8) {
                        warnings.push({ type: 'warning', cat, msg: `⚠️ Pengeluaran ${cat} bulanan mencapai ${Math.round(pct*100)}%. Sisa ${formatRupiah(limit - spent)}.` });
                    }
                }
            });

            return warnings;
        };


        // --- COMPONENTS ---

        // 1. Chart Component
        const ChartComponent = ({ type, data, options }) => {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                if (chartRef.current) chartRef.current.destroy();
                const ctx = canvasRef.current.getContext('2d');
                chartRef.current = new Chart(ctx, { type, data, options });
                return () => { if (chartRef.current) chartRef.current.destroy(); };
            }, [data, type, options]);

            return <canvas ref={canvasRef}></canvas>;
        };

        // 2. Transaction Form Modal
        const TransactionForm = ({ isOpen, onClose, onSave, categories, editData }) => {
            if (!isOpen) return null;
            
            const [formData, setFormData] = useState({
                date: new Date().toISOString().split('T')[0],
                type: 'expense',
                category: categories.expense[0],
                name: '',
                amount: '',
                method: 'Tunai',
                notes: ''
            });

            useEffect(() => {
                if (editData) {
                    setFormData(editData);
                } else {
                    setFormData(prev => ({
                        ...prev,
                        date: new Date().toISOString().split('T')[0],
                        type: 'expense',
                        category: categories.expense[0],
                        name: '',
                        amount: '',
                        method: 'Tunai',
                        notes: ''
                    }));
                }
            }, [editData, isOpen, categories]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                if (name === 'type') {
                    setFormData(prev => ({ ...prev, type: value, category: categories[value][0] }));
                } else {
                    setFormData(prev => ({ ...prev, [name]: value }));
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({ ...formData, amount: Number(formData.amount) });
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl w-full max-w-lg shadow-xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
                            <h2 className="text-xl font-bold text-gray-800">{editData ? 'Edit Transaksi' : 'Tambah Transaksi'}</h2>
                            <button onClick={onClose} className="text-gray-500 hover:text-gray-800"><i className="fas fa-times text-xl"></i></button>
                        </div>
                        <form onSubmit={handleSubmit} className="p-6 overflow-y-auto">
                            <div className="grid grid-cols-1 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
                                    <input type="date" name="date" required value={formData.date} onChange={handleChange} className="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" />
                                </div>
                                <div className="flex space-x-4">
                                    <label className="flex-1 cursor-pointer">
                                        <input type="radio" name="type" value="expense" checked={formData.type === 'expense'} onChange={handleChange} className="peer sr-only" />
                                        <div className="text-center px-4 py-2 border rounded-xl peer-checked:bg-red-50 peer-checked:border-red-500 peer-checked:text-red-700 transition">Pengeluaran</div>
                                    </label>
                                    <label className="flex-1 cursor-pointer">
                                        <input type="radio" name="type" value="income" checked={formData.type === 'income'} onChange={handleChange} className="peer sr-only" />
                                        <div className="text-center px-4 py-2 border rounded-xl peer-checked:bg-green-50 peer-checked:border-green-500 peer-checked:text-green-700 transition">Pemasukan</div>
                                    </label>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                                    <select name="category" required value={formData.category} onChange={handleChange} className="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                                        {categories[formData.type].map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Keterangan / Nama Transaksi</label>
                                    <input type="text" name="name" required placeholder="Contoh: Nasi goreng, Gaji bulan ini..." value={formData.name} onChange={handleChange} className="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nominal (Rp)</label>
                                    <div className="relative">
                                        <span className="absolute left-4 top-2 text-gray-500 font-medium">Rp</span>
                                        <input type="number" name="amount" required min="1" placeholder="0" value={formData.amount} onChange={handleChange} className="w-full pl-12 pr-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-medium" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Metode</label>
                                        <select name="method" value={formData.method} onChange={handleChange} className="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                                            <option value="Tunai">Tunai</option>
                                            <option value="Transfer">Transfer</option>
                                            <option value="E-wallet">E-wallet</option>
                                            <option value="Lainnya">Lainnya</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">Catatan Opsional</label>
                                        <input type="text" name="notes" placeholder="Catatan..." value={formData.notes} onChange={handleChange} className="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />
                                    </div>
                                </div>
                            </div>
                            <div className="mt-8 flex justify-end space-x-3">
                                <button type="button" onClick={onClose} className="px-6 py-2.5 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 font-medium transition">Batal</button>
                                <button type="submit" className="px-6 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-medium shadow-md shadow-blue-200 transition">Simpan Transaksi</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // 3. Confirm Modal
        const ConfirmModal = ({ isOpen, message, onConfirm, onCancel }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl text-center">
                        <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                            <i className="fas fa-exclamation-triangle"></i>
                        </div>
                        <p className="text-gray-800 mb-6 font-medium text-lg">{message}</p>
                        <div className="flex justify-center space-x-3">
                            <button onClick={onCancel} className="px-5 py-2.5 bg-gray-100 rounded-xl hover:bg-gray-200 font-medium">Batal</button>
                            <button onClick={onConfirm} className="px-5 py-2.5 bg-red-600 text-white rounded-xl hover:bg-red-700 font-medium">Ya, Lanjutkan</button>
                        </div>
                    </div>
                </div>
            );
        };

        // 4. Progress Bar Component
        const ProgressBar = ({ label, spent, limit, isMonthly }) => {
            const pct = Math.min((spent / limit) * 100, 100) || 0;
            let color = 'bg-green-500';
            let bgLight = 'bg-green-100';
            if (pct >= 100) { color = 'bg-red-500'; bgLight = 'bg-red-100'; }
            else if (pct >= 80) { color = 'bg-yellow-500'; bgLight = 'bg-yellow-100'; }

            return (
                <div className="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm flex flex-col justify-center">
                    <div className="flex justify-between text-sm mb-3">
                        <span className="font-semibold text-gray-700">{label} <span className="font-normal text-gray-400">{isMonthly ? '(Bulan ini)' : '(Hari ini)'}</span></span>
                        <span className="font-bold text-gray-800">{formatRupiah(spent)} <span className="font-normal text-gray-400">/ {formatRupiah(limit)}</span></span>
                    </div>
                    <div className="w-full bg-gray-100 rounded-full h-2.5 mb-2 overflow-hidden">
                        <div className={`${color} h-2.5 rounded-full transition-all duration-1000 ease-out`} style={{ width: `${pct}%` }}></div>
                    </div>
                    <div className="text-xs text-right font-medium">
                        {pct >= 100 
                            ? <span className="text-red-500">Batas terlampaui {formatRupiah(spent - limit)}</span> 
                            : <span className="text-gray-500">Sisa {formatRupiah(limit - spent)}</span>}
                    </div>
                </div>
            );
        };


        // --- MAIN APP COMPONENT ---
        const App = () => {
            // States
            const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('keuanganku_tx')) || []);
            const [budgets, setBudgets] = useState(() => JSON.parse(localStorage.getItem('keuanganku_budgets')) || DEFAULT_BUDGETS);
            const [categories, setCategories] = useState(() => JSON.parse(localStorage.getItem('keuanganku_categories')) || DEFAULT_CATEGORIES);
            
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [editingTx, setEditingTx] = useState(null);
            
            const [toasts, setToasts] = useState([]);
            const [confirmState, setConfirmState] = useState({ isOpen: false, msg: '', onConfirm: null });

            // Derived Dates
            const todayStr = new Date().toISOString().split('T')[0];
            const currentMonthStr = todayStr.substring(0, 7);

            // Persist to LocalStorage
            useEffect(() => { localStorage.setItem('keuanganku_tx', JSON.stringify(transactions)); }, [transactions]);
            useEffect(() => { localStorage.setItem('keuanganku_budgets', JSON.stringify(budgets)); }, [budgets]);
            useEffect(() => { localStorage.setItem('keuanganku_categories', JSON.stringify(categories)); }, [categories]);

            // Toast System
            const addToast = (msg, type = 'info') => {
                const id = generateId();
                setToasts(prev => [...prev, { id, msg, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 6000);
            };

            const requestConfirm = (msg, onConfirm) => {
                setConfirmState({ isOpen: true, msg, onConfirm });
            };

            // Handlers
            const handleSaveTransaction = (txData) => {
                let newTxs;
                if (editingTx) {
                    newTxs = transactions.map(t => t.id === editingTx.id ? { ...txData, id: t.id } : t);
                } else {
                    newTxs = [...transactions, { ...txData, id: generateId() }];
                }
                setTransactions(newTxs);
                setIsFormOpen(false);
                setEditingTx(null);

                // Notifications
                if (txData.type === 'expense') {
                    const warnings = checkWarnings(newTxs, txData.date, budgets);
                    const relatedWarnings = warnings.filter(w => w.cat === txData.category || (txData.category.includes('Makan') && w.cat === 'Total makan'));
                    
                    if (relatedWarnings.length > 0) {
                        relatedWarnings.forEach(w => addToast(w.msg, w.type));
                    } else {
                        addToast('✅ Transaksi tersimpan. Pengeluaran masih sesuai anggaran.', 'success');
                    }
                } else {
                    addToast('✅ Pemasukan berhasil dicatat.', 'success');
                }
            };

            const handleDeleteTransaction = (id) => {
                requestConfirm('Apakah Anda yakin ingin menghapus transaksi ini? Aksi ini tidak dapat dibatalkan.', () => {
                    setTransactions(prev => prev.filter(t => t.id !== id));
                    addToast('Transaksi berhasil dihapus.', 'success');
                });
            };

            const openAddForm = () => {
                setEditingTx(null);
                setIsFormOpen(true);
            };

            const openEditForm = (tx) => {
                setEditingTx(tx);
                setIsFormOpen(true);
            };

            // --- TAB RENDERERS ---

            const renderDashboard = () => {
                const todayTxs = transactions.filter(t => t.date === todayStr);
                const monthTxs = transactions.filter(t => t.date.startsWith(currentMonthStr));

                const sumAmount = (arr, type) => arr.filter(t => t.type === type).reduce((sum, t) => sum + t.amount, 0);

                const tdInc = sumAmount(todayTxs, 'income');
                const tdExp = sumAmount(todayTxs, 'expense');
                const tdBal = tdInc - tdExp;

                const moInc = sumAmount(monthTxs, 'income');
                const moExp = sumAmount(monthTxs, 'expense');
                const moBal = moInc - moExp;

                const currentWarnings = checkWarnings(transactions, todayStr, budgets);

                return (
                    <div className="space-y-6 animate-fade-in pb-10">
                        <div className="flex flex-col md:flex-row justify-between md:items-end mb-2 gap-4">
                            <div>
                                <h1 className="text-2xl font-bold text-gray-800">Dashboard</h1>
                                <p className="text-gray-500">Ringkasan keuangan Anda hari ini, {todayStr}</p>
                            </div>
                            <button onClick={openAddForm} className="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-medium shadow-lg shadow-blue-200 hover:bg-blue-700 hover:-translate-y-0.5 transition-all w-full md:w-auto">
                                <i className="fas fa-plus mr-2"></i>Tambah Transaksi
                            </button>
                        </div>

                        {/* Peringatan Box */}
                        {currentWarnings.length > 0 && (
                            <div className="bg-orange-50 border border-orange-200 rounded-2xl p-4 shadow-sm">
                                <h3 className="font-bold text-orange-800 mb-2 flex items-center"><i className="fas fa-bell mr-2"></i> Peringatan Anggaran Hari Ini</h3>
                                <ul className="space-y-2">
                                    {currentWarnings.map((w, i) => (
                                        <li key={i} className={`text-sm ${w.type === 'danger' ? 'text-red-700' : 'text-orange-700'} flex items-start`}>
                                            <span className="mr-2 mt-0.5">{w.type === 'danger' ? '🚨' : '⚠️'}</span> {w.msg}
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        )}
                        {currentWarnings.length === 0 && todayTxs.filter(t=>t.type==='expense').length > 0 && (
                             <div className="bg-green-50 border border-green-200 rounded-2xl p-4 shadow-sm flex items-center text-green-700 text-sm">
                                 <i className="fas fa-check-circle mr-2 text-lg"></i> Semua pengeluaran Anda hari ini masih sesuai anggaran!
                             </div>
                        )}

                        {/* Cards: Hari Ini */}
                        <div>
                            <h2 className="text-lg font-bold text-gray-700 mb-3 ml-1">Hari Ini</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 border-l-4 border-l-green-500">
                                    <div className="text-gray-500 text-sm mb-1 font-medium">Pemasukan Hari Ini</div>
                                    <div className="text-2xl font-bold text-gray-800">{formatRupiah(tdInc)}</div>
                                </div>
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 border-l-4 border-l-red-500">
                                    <div className="text-gray-500 text-sm mb-1 font-medium">Pengeluaran Hari Ini</div>
                                    <div className="text-2xl font-bold text-gray-800">{formatRupiah(tdExp)}</div>
                                </div>
                                <div className={`bg-white p-5 rounded-2xl shadow-sm border border-gray-100 border-l-4 ${tdBal < 0 ? 'border-l-red-500' : 'border-l-blue-500'}`}>
                                    <div className="text-gray-500 text-sm mb-1 font-medium">Saldo Hari Ini</div>
                                    <div className={`text-2xl font-bold ${tdBal < 0 ? 'text-red-600' : 'text-gray-800'}`}>
                                        {tdBal < 0 ? `Defisit ${formatRupiah(Math.abs(tdBal))}` : formatRupiah(tdBal)}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Cards: Bulan Ini */}
                        <div>
                            <h2 className="text-lg font-bold text-gray-700 mb-3 ml-1">Bulan Ini</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                    <div className="text-gray-500 text-sm mb-1 font-medium">Pemasukan Bulan Ini</div>
                                    <div className="text-2xl font-bold text-gray-800">{formatRupiah(moInc)}</div>
                                </div>
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                    <div className="text-gray-500 text-sm mb-1 font-medium">Pengeluaran Bulan Ini</div>
                                    <div className="text-2xl font-bold text-gray-800">{formatRupiah(moExp)}</div>
                                </div>
                                <div className={`bg-white p-5 rounded-2xl shadow-sm border border-gray-100`}>
                                    <div className="text-gray-500 text-sm mb-1 font-medium">Saldo Bersih Bulan Ini</div>
                                    <div className={`text-2xl font-bold ${moBal < 0 ? 'text-red-600' : 'text-gray-800'}`}>
                                        {moBal < 0 ? `Defisit ${formatRupiah(Math.abs(moBal))}` : formatRupiah(moBal)}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Indikator Anggaran */}
                        <div>
                            <h2 className="text-lg font-bold text-gray-700 mb-3 ml-1">Indikator Anggaran</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {/* Calculate specific sums */}
                                {(() => {
                                    const dailySums = {};
                                    todayTxs.filter(t=>t.type==='expense').forEach(t => dailySums[t.category] = (dailySums[t.category]||0) + t.amount);
                                    const tm = (dailySums['Makan pagi']||0) + (dailySums['Makan siang']||0) + (dailySums['Makan malam']||0);
                                    
                                    const monthlySums = {};
                                    monthTxs.filter(t=>t.type==='expense').forEach(t => monthlySums[t.category] = (monthlySums[t.category]||0) + t.amount);

                                    return (
                                        <>
                                            {Object.entries(budgets.daily).filter(([k,v]) => v > 0).map(([k, limit]) => (
                                                <ProgressBar key={k} label={k} spent={k === 'Total makan' ? tm : (dailySums[k]||0)} limit={limit} isMonthly={false} />
                                            ))}
                                            {Object.entries(budgets.monthly).filter(([k,v]) => v > 0).map(([k, limit]) => (
                                                <ProgressBar key={k} label={k} spent={monthlySums[k]||0} limit={limit} isMonthly={true} />
                                            ))}
                                        </>
                                    )
                                })()}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderHistory = () => {
                const [filterMonth, setFilterMonth] = useState(currentMonthStr);
                const [filterType, setFilterType] = useState('all');
                const [search, setSearch] = useState('');
                const [sort, setSort] = useState('newest');

                const filteredTxs = transactions.filter(t => {
                    const matchMonth = filterMonth ? t.date.startsWith(filterMonth) : true;
                    const matchType = filterType === 'all' || t.type === filterType;
                    const matchSearch = t.name.toLowerCase().includes(search.toLowerCase()) || (t.notes && t.notes.toLowerCase().includes(search.toLowerCase())) || t.category.toLowerCase().includes(search.toLowerCase());
                    return matchMonth && matchType && matchSearch;
                }).sort((a, b) => {
                    if (sort === 'newest') return new Date(b.date) - new Date(a.date);
                    return new Date(a.date) - new Date(b.date);
                });

                return (
                    <div className="space-y-6 animate-fade-in h-full flex flex-col">
                        <h1 className="text-2xl font-bold text-gray-800">Riwayat Transaksi</h1>
                        
                        {/* Filters */}
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 no-print">
                            <input type="month" value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />
                            <select value={filterType} onChange={e => setFilterType(e.target.value)} className="px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="all">Semua Jenis</option>
                                <option value="income">Pemasukan</option>
                                <option value="expense">Pengeluaran</option>
                            </select>
                            <input type="text" placeholder="Cari nama / keterangan..." value={search} onChange={e => setSearch(e.target.value)} className="flex-1 px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" />
                            <select value={sort} onChange={e => setSort(e.target.value)} className="px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="newest">Terbaru</option>
                                <option value="oldest">Terlama</option>
                            </select>
                        </div>

                        {/* Table */}
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex-1 overflow-hidden flex flex-col">
                            <div className="overflow-x-auto flex-1">
                                <table className="w-full text-left border-collapse min-w-[700px]">
                                    <thead className="sticky top-0 bg-gray-50 shadow-sm z-10">
                                        <tr className="text-gray-600 text-sm">
                                            <th className="p-4 font-semibold">Tanggal</th>
                                            <th className="p-4 font-semibold">Jenis</th>
                                            <th className="p-4 font-semibold">Kategori & Keterangan</th>
                                            <th className="p-4 font-semibold">Metode</th>
                                            <th className="p-4 font-semibold">Nominal</th>
                                            <th className="p-4 font-semibold text-right no-print">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredTxs.length === 0 ? (
                                            <tr><td colSpan="6" className="p-8 text-center text-gray-500">Tidak ada transaksi ditemukan.</td></tr>
                                        ) : filteredTxs.map(t => (
                                            <tr key={t.id} className="border-b hover:bg-gray-50 transition">
                                                <td className="p-4 text-sm text-gray-600">{t.date}</td>
                                                <td className="p-4">
                                                    <span className={`px-2.5 py-1 text-xs font-semibold rounded-full ${t.type === 'income' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                                        {t.type === 'income' ? 'Pemasukan' : 'Pengeluaran'}
                                                    </span>
                                                </td>
                                                <td className="p-4">
                                                    <div className="font-semibold text-gray-800">{t.category}</div>
                                                    <div className="text-xs text-gray-500">{t.name} {t.notes && `- ${t.notes}`}</div>
                                                </td>
                                                <td className="p-4 text-sm text-gray-600">{t.method}</td>
                                                <td className={`p-4 font-bold ${t.type === 'income' ? 'text-green-600' : 'text-gray-800'}`}>
                                                    {t.type === 'income' ? '+' : '-'}{formatRupiah(t.amount)}
                                                </td>
                                                <td className="p-4 text-right no-print space-x-3">
                                                    <button onClick={() => openEditForm(t)} className="text-blue-500 hover:text-blue-700"><i className="fas fa-edit"></i></button>
                                                    <button onClick={() => handleDeleteTransaction(t.id)} className="text-red-500 hover:text-red-700"><i className="fas fa-trash"></i></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderReports = () => {
                const [reportPeriod, setReportPeriod] = useState('monthly');
                const [date1, setDate1] = useState(todayStr);
                const [date2, setDate2] = useState(todayStr);
                
                // Filter Logic
                const reportTxs = transactions.filter(t => {
                    if (reportPeriod === 'daily') return t.date === date1;
                    if (reportPeriod === 'monthly') return t.date.startsWith(date1.substring(0,7));
                    if (reportPeriod === 'yearly') return t.date.startsWith(date1.substring(0,4));
                    if (reportPeriod === 'custom') return t.date >= date1 && t.date <= date2;
                    return true;
                });

                // Calculations
                const tInc = reportTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
                const tExp = reportTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
                const net = tInc - tExp;

                const expCats = {};
                reportTxs.filter(t=>t.type==='expense').forEach(t => expCats[t.category] = (expCats[t.category]||0) + t.amount);
                
                let biggestCat = '-';
                let biggestAmt = 0;
                Object.keys(expCats).forEach(k => {
                    if(expCats[k] > biggestAmt) { biggestAmt = expCats[k]; biggestCat = k; }
                });

                // Count days exceeded & total overage
                let daysExceeded = 0;
                let totalOverage = 0;
                
                const uniqueDates = [...new Set(reportTxs.map(t=>t.date))];
                uniqueDates.forEach(d => {
                    const ws = checkWarnings(transactions, d, budgets); // Check context of all txs for that date
                    const dangerDailys = ws.filter(w => w.type === 'danger' && budgets.daily[w.cat] !== undefined);
                    if (dangerDailys.length > 0) daysExceeded++;
                    
                    // Sum overage for daily
                    const dt = transactions.filter(t=>t.date===d && t.type==='expense');
                    const ds = {}; dt.forEach(t => ds[t.category] = (ds[t.category]||0)+t.amount);
                    const tm = (ds['Makan pagi']||0) + (ds['Makan siang']||0) + (ds['Makan malam']||0);
                    Object.keys(budgets.daily).forEach(cat => {
                        const lim = budgets.daily[cat];
                        const sp = cat === 'Total makan' ? tm : (ds[cat]||0);
                        if (lim > 0 && sp > lim) totalOverage += (sp - lim);
                    });
                });

                const uniqueMonths = [...new Set(reportTxs.map(t=>t.date.substring(0,7)))];
                uniqueMonths.forEach(m => {
                    const mt = transactions.filter(t=>t.date.startsWith(m) && t.type==='expense');
                    const ms = {}; mt.forEach(t => ms[t.category] = (ms[t.category]||0)+t.amount);
                    Object.keys(budgets.monthly).forEach(cat => {
                        const lim = budgets.monthly[cat];
                        const sp = ms[cat]||0;
                        if (lim > 0 && sp > lim) totalOverage += (sp - lim);
                    });
                });

                // Charts Data
                const barData = {
                    labels: ['Pemasukan', 'Pengeluaran'],
                    datasets: [{
                        label: 'Total Rupiah',
                        data: [tInc, tExp],
                        backgroundColor: ['#22c55e', '#ef4444'],
                        borderRadius: 8
                    }]
                };

                const pieData = {
                    labels: Object.keys(expCats),
                    datasets: [{
                        data: Object.values(expCats),
                        backgroundColor: ['#f87171', '#fb923c', '#fbbf24', '#a3e635', '#34d399', '#2dd4bf', '#38bdf8', '#818cf8', '#a78bfa', '#e879f9', '#fb7185', '#94a3b8'],
                        borderWidth: 0
                    }]
                };

                // Exports
                const handleExportCSV = () => {
                    const headers = ["ID", "Tanggal", "Jenis", "Kategori", "Nama", "Nominal", "Metode", "Catatan"];
                    const rows = reportTxs.map(t => [t.id, t.date, t.type, `"${t.category}"`, `"${t.name}"`, t.amount, `"${t.method}"`, `"${t.notes}"`]);
                    const csv = headers.join(",") + "\n" + rows.map(e => e.join(",")).join("\n");
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = `Laporan_Keuangan_${date1}.csv`;
                    link.click();
                };

                const handleExportJSON = () => {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions));
                    const link = document.createElement('a');
                    link.href = dataStr;
                    link.download = "keuanganku_backup.json";
                    link.click();
                };

                const handleImportJSON = (e) => {
                    const file = e.target.files[0];
                    if(!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = JSON.parse(e.target.result);
                            if (Array.isArray(data)) {
                                requestConfirm('Data saat ini akan ditimpa dengan data dari file cadangan. Lanjutkan?', () => {
                                    setTransactions(data);
                                    addToast('Data berhasil diimpor', 'success');
                                });
                            } else { addToast('Format JSON tidak valid.', 'danger'); }
                        } catch(err) { addToast('Gagal membaca file.', 'danger'); }
                    };
                    reader.readAsText(file);
                };

                return (
                    <div className="space-y-6 animate-fade-in print-full">
                        <div className="flex flex-col md:flex-row justify-between md:items-end gap-4 no-print">
                            <div>
                                <h1 className="text-2xl font-bold text-gray-800">Laporan Keuangan</h1>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                <button onClick={() => window.print()} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-medium"><i className="fas fa-print mr-2"></i>Cetak</button>
                                <button onClick={handleExportCSV} className="px-4 py-2 bg-green-100 hover:bg-green-200 text-green-700 rounded-xl font-medium"><i className="fas fa-file-csv mr-2"></i>Unduh CSV</button>
                                <button onClick={handleExportJSON} className="px-4 py-2 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-xl font-medium"><i className="fas fa-download mr-2"></i>Ekspor Data</button>
                                <label className="px-4 py-2 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-xl font-medium cursor-pointer">
                                    <i className="fas fa-upload mr-2"></i>Impor Data
                                    <input type="file" accept=".json" className="hidden" onChange={handleImportJSON} />
                                </label>
                            </div>
                        </div>

                        {/* Controls */}
                        <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 items-center no-print">
                            <label className="font-medium text-gray-600">Periode:</label>
                            <select value={reportPeriod} onChange={e => setReportPeriod(e.target.value)} className="px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="daily">Harian</option>
                                <option value="monthly">Bulanan</option>
                                <option value="yearly">Tahunan</option>
                                <option value="custom">Kustom (Rentang)</option>
                            </select>
                            
                            {reportPeriod === 'daily' && <input type="date" value={date1} onChange={e=>setDate1(e.target.value)} className="px-4 py-2 border rounded-xl outline-none" />}
                            {reportPeriod === 'monthly' && <input type="month" value={date1.substring(0,7)} onChange={e=>setDate1(e.target.value+'-01')} className="px-4 py-2 border rounded-xl outline-none" />}
                            {reportPeriod === 'yearly' && <input type="number" min="2000" value={date1.substring(0,4)} onChange={e=>setDate1(`${e.target.value}-01-01`)} className="px-4 py-2 border rounded-xl outline-none w-32" />}
                            {reportPeriod === 'custom' && (
                                <div className="flex items-center gap-2">
                                    <input type="date" value={date1} onChange={e=>setDate1(e.target.value)} className="px-4 py-2 border rounded-xl outline-none" />
                                    <span>-</span>
                                    <input type="date" value={date2} onChange={e=>setDate2(e.target.value)} className="px-4 py-2 border rounded-xl outline-none" />
                                </div>
                            )}
                        </div>

                        {/* Summary Cards */}
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                <div className="text-sm text-gray-500 mb-1">Total Pemasukan</div>
                                <div className="text-xl font-bold text-green-600">{formatRupiah(tInc)}</div>
                            </div>
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                <div className="text-sm text-gray-500 mb-1">Total Pengeluaran</div>
                                <div className="text-xl font-bold text-red-600">{formatRupiah(tExp)}</div>
                            </div>
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                <div className="text-sm text-gray-500 mb-1">Saldo Bersih</div>
                                <div className={`text-xl font-bold ${net < 0 ? 'text-red-600' : 'text-gray-800'}`}>
                                    {net < 0 ? `Defisit ${formatRupiah(Math.abs(net))}` : formatRupiah(net)}
                                </div>
                            </div>
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                <div className="text-sm text-gray-500 mb-1">Pengeluaran Terbesar</div>
                                <div className="text-lg font-bold text-gray-800">{biggestCat}</div>
                                <div className="text-xs text-gray-500">{formatRupiah(biggestAmt)}</div>
                            </div>
                        </div>

                        {/* Budget Info */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-orange-50 border border-orange-200 p-4 rounded-2xl flex items-center justify-between">
                                <div>
                                    <div className="text-orange-800 font-medium text-sm">Hari Melebihi Anggaran Harian</div>
                                    <div className="text-2xl font-bold text-orange-900">{daysExceeded} Hari</div>
                                </div>
                                <i className="fas fa-calendar-times text-4xl text-orange-300"></i>
                            </div>
                            <div className="bg-red-50 border border-red-200 p-4 rounded-2xl flex items-center justify-between">
                                <div>
                                    <div className="text-red-800 font-medium text-sm">Estimasi Total Kelebihan Anggaran</div>
                                    <div className="text-2xl font-bold text-red-900">{formatRupiah(totalOverage)}</div>
                                </div>
                                <i className="fas fa-arrow-trend-up text-4xl text-red-300"></i>
                            </div>
                        </div>

                        {/* Charts */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pb-10">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                <h3 className="text-center font-bold text-gray-700 mb-4">Perbandingan</h3>
                                <ChartComponent type="bar" data={barData} options={{ responsive: true, plugins: { legend: { display: false } } }} />
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                <h3 className="text-center font-bold text-gray-700 mb-4">Komposisi Pengeluaran</h3>
                                {Object.keys(expCats).length > 0 ? (
                                    <div className="w-2/3 mx-auto">
                                        <ChartComponent type="doughnut" data={pieData} options={{ responsive: true }} />
                                    </div>
                                ) : <p className="text-center text-gray-500 mt-10">Tidak ada pengeluaran.</p>}
                            </div>
                        </div>

                    </div>
                );
            };

            const renderSettings = () => {
                const [localBudgets, setLocalBudgets] = useState(budgets);
                
                const handleSaveBudgets = () => {
                    setBudgets(localBudgets);
                    addToast('Pengaturan anggaran berhasil disimpan.', 'success');
                };

                return (
                    <div className="space-y-6 animate-fade-in pb-10 max-w-4xl">
                        <h1 className="text-2xl font-bold text-gray-800">Pengaturan Anggaran</h1>
                        <p className="text-gray-600 mb-6">Atur batas anggaran harian dan bulanan Anda. Perubahan di sini tidak akan mengubah nominal transaksi yang sudah tersimpan. Data disimpan secara lokal di browser ini.</p>
                        
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <h2 className="text-lg font-bold text-gray-800 mb-4 pb-2 border-b"><i className="fas fa-calendar-day mr-2 text-blue-500"></i> Anggaran Harian</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {Object.keys(localBudgets.daily).map(key => (
                                    <div key={key}>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">{key}</label>
                                        <div className="relative">
                                            <span className="absolute left-4 top-2 text-gray-500">Rp</span>
                                            <input type="number" min="0" value={localBudgets.daily[key]} 
                                                onChange={(e) => setLocalBudgets(prev => ({...prev, daily: {...prev.daily, [key]: Number(e.target.value)}}))}
                                                className="w-full pl-12 pr-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" 
                                            />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                            <h2 className="text-lg font-bold text-gray-800 mb-4 pb-2 border-b"><i className="fas fa-calendar-alt mr-2 text-purple-500"></i> Anggaran Bulanan</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {Object.keys(localBudgets.monthly).map(key => (
                                    <div key={key}>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">{key}</label>
                                        <div className="relative">
                                            <span className="absolute left-4 top-2 text-gray-500">Rp</span>
                                            <input type="number" min="0" value={localBudgets.monthly[key]} 
                                                onChange={(e) => setLocalBudgets(prev => ({...prev, monthly: {...prev.monthly, [key]: Number(e.target.value)}}))}
                                                className="w-full pl-12 pr-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" 
                                            />
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="flex justify-end pt-4">
                            <button onClick={handleSaveBudgets} className="px-8 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition">
                                Simpan Pengaturan
                            </button>
                        </div>
                    </div>
                );
            };

            // MAIN RENDER
            return (
                <div className="flex h-screen w-full bg-gray-50 overflow-hidden font-sans">
                    {/* Mobile Sidebar Overlay */}
                    {sidebarOpen && <div className="fixed inset-0 bg-black/50 z-20 md:hidden transition-opacity" onClick={() => setSidebarOpen(false)}></div>}
                    
                    {/* Sidebar */}
                    <aside className={`fixed inset-y-0 left-0 w-64 bg-white shadow-xl border-r border-gray-100 z-30 transform transition-transform duration-300 flex flex-col md:relative md:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} no-print`}>
                        <div className="p-6 border-b border-gray-50 flex items-center justify-between">
                            <h1 className="text-2xl font-extrabold text-blue-700 tracking-tight">KEUANGANKU</h1>
                            <button className="md:hidden text-gray-500" onClick={()=>setSidebarOpen(false)}><i className="fas fa-times text-xl"></i></button>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                            {[
                                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard' },
                                { id: 'history', icon: 'fa-list-ul', label: 'Riwayat Transaksi' },
                                { id: 'reports', icon: 'fa-chart-line', label: 'Laporan Keuangan' },
                                { id: 'settings', icon: 'fa-cog', label: 'Pengaturan Anggaran' }
                            ].map(item => (
                                <button key={item.id} onClick={() => { setActiveTab(item.id); setSidebarOpen(false); }} 
                                    className={`w-full flex items-center px-4 py-3 rounded-xl transition-all font-medium ${activeTab === item.id ? 'bg-blue-50 text-blue-700' : 'text-gray-600 hover:bg-gray-50'}`}>
                                    <i className={`fas ${item.icon} w-6 text-center mr-3 ${activeTab === item.id ? 'text-blue-600' : 'text-gray-400'}`}></i>
                                    {item.label}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gray-50">
                            <button onClick={openAddForm} className="w-full bg-blue-600 text-white px-4 py-3 rounded-xl font-bold shadow-md hover:bg-blue-700 transition">
                                <i className="fas fa-plus mr-2"></i> Tambah
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                        {/* Header */}
                        <header className="bg-white/80 backdrop-blur-md border-b border-gray-100 px-6 py-4 flex justify-between items-center z-10 no-print">
                            <button className="md:hidden text-gray-600 text-xl" onClick={() => setSidebarOpen(true)}>
                                <i className="fas fa-bars"></i>
                            </button>
                            <div className="text-gray-500 text-sm font-medium ml-auto">
                                <i className="far fa-calendar-alt mr-2"></i>{new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                            </div>
                        </header>
                        
                        {/* Page Content */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            {activeTab === 'dashboard' && renderDashboard()}
                            {activeTab === 'history' && renderHistory()}
                            {activeTab === 'reports' && renderReports()}
                            {activeTab === 'settings' && renderSettings()}
                        </main>
                    </div>

                    {/* Modals & Toasts */}
                    <TransactionForm isOpen={isFormOpen} onClose={() => setIsFormOpen(false)} onSave={handleSaveTransaction} categories={categories} editData={editingTx} />
                    <ConfirmModal {...confirmState} onCancel={() => setConfirmState({ isOpen: false })} />
                    
                    <div className="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 no-print">
                        {toasts.map(t => (
                            <div key={t.id} className={`px-6 py-3 rounded-xl shadow-lg border text-sm font-medium flex items-start animate-fade-in
                                ${t.type === 'danger' ? 'bg-red-50 border-red-200 text-red-800' : 
                                  t.type === 'warning' ? 'bg-orange-50 border-orange-200 text-orange-800' : 
                                  'bg-green-50 border-green-200 text-green-800'}`}>
                                <span className="mr-3 text-lg">{t.type === 'danger' ? '🚨' : t.type === 'warning' ? '⚠️' : '✅'}</span>
                                {t.msg}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
